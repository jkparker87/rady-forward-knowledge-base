site_name: Data Knowledge Base
site_description: A human-centered knowledge layer connecting business concepts, metrics, content domains, and curated data assets.
site_url: https://jkparker87.github.io/rady-forward-knowledge-base/
repo_name: RCH Knowledge Base
repo_url: https://github.com/jkparker87/rady-forward-knowledge-base
edit_uri: edit/main/docs/

use_directory_urls: true
strict: true

theme:
  name: material  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search  

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Start Here:
      - start-here/index.md
      - How to Use This Site: start-here/how-to-use.md
      - Platform & Source-of-Truth Map: start-here/platform-map.md
      - Content Model: start-here/content-model.md

  - How We Work:
      - how-we-work/index.md
      - Task Management: how-we-work/task-management.md
      - Writing Good Tasks: how-we-work/writing-good-tasks.md
      - Analytics Development Lifecycle: how-we-work/analytics-development-lifecycle.md
      - Research Administration Support: how-we-work/research-administration.md

  - Standards & Playbooks:
      - standards/index.md
      - SQL Style Guide: standards/sql-style-guide.md
      - Analytics Methods: standards/analytics-methods.md
      - Data Quality: standards/data-quality.md
      - Documentation Standard: standards/documentation.md

  - Product Design:
      - product-design/index.md
      - User Personas: product-design/user-personas.md
      - User Stories & Acceptance Criteria: product-design/user-stories.md

  - Systems & Data Flows:
      - systems/index.md
      - Epic / Clarity / Caboodle: systems/epic.md
      - Databricks: systems/databricks.md
      - Alation: systems/alation.md
      - Cozeva: systems/cozeva.md

  - AI & Automation:
      - ai-automation/index.md
      - GitHub Copilot: ai-automation/github-copilot.md
      - Responsible AI: ai-automation/responsible-ai.md
      - Automation Patterns: ai-automation/automation-patterns.md

  - Governance & Communities:
      - governance/index.md
      - Content Governance: governance/content-governance.md
      - Workgroups:
          - Analytics Methods: governance/workgroups/analytics-methods.md
          - GitHub Copilot: governance/workgroups/github-copilot.md
          - Product Management & Personas: governance/workgroups/product-management.md
      - Initiatives:
          - Analytics Standardization: governance/initiatives/analytics-standardization.md
          - Enterprise-Enabled Copilot: governance/initiatives/copilot-adoption.md

  - Learning:
      - learning/index.md
      - Data Literacy: learning/data-literacy.md
      - AI Literacy: learning/ai-literacy.md

  - Technical Reference:
      - technical/index.md
      - GitHub / Repository Architecture: technical/repository-architecture.md
      - Copilot Framework Reference: technical/copilot-framework-reference.md
      - Internal Technical Documentation: technical/internal-only.md

  - Contribute: contributing.md
  - Tags: tags.md
